<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Notebook{{ else }}{{ .Title }}{{ end }} · {{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  {{ $styles := resources.Get "style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ if not .IsHome }}<header><a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a><span class="edition">Notebook / 001</span></header>{{ end }}
  <main id="main"{{ if .IsHome }} class="home"{{ end }}>{{ block "main" . }}{{ end }}</main>
  <footer><p>{{ site.Params.disclosure }}</p><a href="{{ site.Params.sourceRepository }}">Source on GitHub</a></footer>
</body>
</html>
