{{ define "main" }}
<article>
  <a class="back" href="{{ site.Home.RelPermalink }}">All entries</a>
  <h1>{{ .Title }}</h1>
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time> · {{ (index site.Data.authors .Params.author).name }}</p>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
