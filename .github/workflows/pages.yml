name: Build and publish Hugo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.166.0'
      REPO_NAME: ${{ github.event.repository.name }}
      HUGO_PARAMS_SOURCEREPOSITORY: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fLsS --retry 2 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Check version
        run: hugo version
      - name: Build and check repository paths
        run: |
          hugo --baseURL "https://example.test/${REPO_NAME}/"
          python3 scripts/check-output.py public "/${REPO_NAME}/"
      - name: Exercise editorial changes
        run: python3 scripts/editorial-trials.py hugo
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build deployment output
        if: github.event_name != 'pull_request'
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: hugo --baseURL "$SITE_BASE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
